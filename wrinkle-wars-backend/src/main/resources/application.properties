spring.application.name=wrinkle-wars-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wrinklewars}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mvc.problemdetails.enabled=true

# Development only: create the empty PostgreSQL database before starting the application.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Profile avatar upload: maximum 2 MB for PNG/JPEG; validation is performed by the controller.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Local HTTP remains usable. Enable Secure cookies for an HTTPS deployment via application-https.properties.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
